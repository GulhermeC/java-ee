<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Census - Rick and Morty</title>
</head>
<body>
    <h1>Census</h1>

    <form action="/api/census" method="get">
    
        <div>
            <label for="offset">Offset:</label><br>
            <input type="number" name="offset" id="offset" value="1">
        </div>

        <div>
            <label for="limit">Limit:</label><br>
            <input type="number" name="limit" id="limit" value="20">
        </div>

        <div>
            <label for="showAlerts">Mostrar alertas de aliens mortos:</label><br>
            <select name="showAlerts" id="showAlerts">
                <option value="true" selected>Sim</option>
                <option value="false">Não</option>
            </select>
        </div>
        <br>
        <button type="submit">Consultar Censo</button>
    </form>
</body>
</html>
